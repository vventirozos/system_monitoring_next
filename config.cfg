# system_monitoring_next configuration. Full reference: README.md
# Validate with: system_monitoring_next.py -t config.cfg

[global]
logdir = /data/system_monitoring_next_logs

[env]
# psql is searched here: Ubuntu/Debian and RHEL packages, then the system; adjust to your version
PATH = /usr/lib/postgresql/17/bin:/usr/pgsql-17/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

[retention]
compress_after = 1h
# The old config deleted after 2 days (its comment said 2 months). 15d allows comparing
# with the same time last week; checks with their own keep are small.
# max_size_per_target still wins: look at the disk after a few days.
keep           = 15d
# per cluster (and for os): oldest logs are removed above this, whatever their age
max_size_per_target = 10GB
# one check's file of one hour; the rest of the hour is dropped
max_file_size = 512MB
# logging pauses while the filesystem has less free space than this
min_free_space = 2GB

[limits]
max_parallel_commands = 4
command_timeout       = 10s
# per run; per minute for persistent checks
max_output            = 8MB
max_rows              = 100000
max_memory            = 1GB

[postgres]
# defaults of every query; a check may override both timeouts
statement_timeout = 2s
lock_timeout      = 200ms

# One section per cluster. Logs go to <logdir>/<name> unless logdir is set here.
[cluster main]
port     = 5432
# To run without superuser: see "Role" in README.md
user     = postgres
database = demo_production
# host   = /var/run/postgresql
# logdir = /data2/monitoring_main

#[cluster reporting]
#port     = 5433
#database = reports
#logdir   = /data/reporting_monitoring_logs
# ---------------------------------------- system: CPU, memory, processes
[check iostat]
type   = persistent
exec   = iostat -kxy 5
format = iostat

[check vmstat]
type   = persistent
exec   = vmstat 5
format = vmstat

[check mpstat]
type   = persistent
exec   = mpstat 5
format = mpstat

[check loadavg]
interval = 10
file     = /proc/loadavg
format   = loadavg

# was file = /proc/stat: the "intr" line alone can be >10KB. Still format = procstat.
[check cpu]
interval = 10
exec     = awk '$1=="intr"{print $1,$2,"-"; next}{print}' /proc/stat
format   = procstat

[check mem]
interval = 10
file     = /proc/meminfo
format   = kv

# Pressure: were tasks stalled on cpu / memory / io? Best single "was the box the
# problem" signal. kv would keep only avg10: use a table. total = microseconds, use
# differences. Needs kernel 4.20+ (RHEL 8/9: boot with psi=1). No rows without PSI.
[check psi]
interval = 10
keep     = 35d
exec     = cd /proc/pressure 2>/dev/null && cat cpu io memory >/dev/null 2>&1 || exit 0; awk 'BEGIN{print "resource kind avg10 avg60 avg300 total"}{gsub(/[a-z0-9]+=/,""); print FILENAME,$0}' cpu io memory
format   = table

# /proc/vmstat has ~150 lines: the ones that explain stalls. One row per run.
[check vmstat_counters]
interval = 10
exec     = awk '/^(pgpgin|pgpgout|pswpin|pswpout|pgfault|pgmajfault|allocstall_(normal|movable)|pgscan_(kswapd|direct)|pgsteal_(kswapd|direct)|workingset_refault_(anon|file)|compact_stall|compact_fail|thp_fault_alloc|thp_collapse_alloc|oom_kill|numa_miss|numa_pages_migrated|nr_dirty|nr_writeback|nr_dirty_threshold|nr_dirty_background_threshold|drop_pagecache) /{h=h" "$1; v=v" "$2} END{print h; print v}' /proc/vmstat
format   = table

# per NUMA node: free / page cache, and allocations that missed their node
[check numa]
interval = 60
exec     = echo "node free_kb file_kb numa_miss numa_foreign"; for n in /sys/devices/system/node/node[0-9]*; do [ -r $n/numastat ] && awk -v n=$(basename $n) 'FILENAME ~ /meminfo$/{if ($3=="MemFree:") f=$4; if ($3=="FilePages:") c=$4; next} {v[$1]=$2} END{print n, f, c, v["numa_miss"], v["numa_foreign"]}' $n/meminfo $n/numastat; done; true
format   = table

# was without state; %cpu is the lifetime average: use differences of cputime
# (seconds; etimes instead of lstart is shorter but breaks old logs)
[check ps]
interval = 30
exec     = ps axo user,pid,ppid,pgrp,%cpu,%mem,rss,lstart,nice,nlwp,sgi_p,cputime,tty,stat,wchan:25,args
format   = table

# Private (anonymous) memory per process: RSS in ps counts shared buffers again in
# every backend and is useless. 25 largest. Does not take the process' memory lock.
[check mem_private]
interval = 30
exec     = echo "name pid rss_anon_kb swap_kb"; cat /proc/[0-9]*/status 2>/dev/null | awk '/^Name:/{n=$2} /^Pid:/{p=$2} /^RssAnon:/{a=$2} /^VmSwap:/{if (a) print n, p, a, $2; a=0}' | sort -k3,3nr | head -25
format   = table

# Processes in D state: who hangs on the disk, where (wchan needs root for others' processes).
# comm, not args: reading the command line of a hung process can hang ps too.
[check dstate]
interval = 10
exec     = ps axo stat:6,pid,ppid,user:16,wchan:30,comm | awk 'NR==1 || $1 ~ /^D/'
format   = table

# backends per state, per cluster port (replaces the perl one-liner)
[check pg_processes]
type     = pg_processes
interval = 15

# was free -h (rounded to 0.1Gi); mem (/proc/meminfo, 10s) has it all
[check free]
enabled  = no
interval = 60
exec     = free -k
format   = free

# ------------------------------------------------- system: disk, network
[check df]
interval = 60
exec     = df -x tmpfs -x devtmpfs -x squashfs -l -P
format   = table

# /dev/shm (parallel query; "df -x tmpfs" hides it) and inodes
[check df_shm]
interval = 60
exec     = df -P /dev/shm
format   = table

[check df_inodes]
interval = 5min
exec     = df -i -x tmpfs -x devtmpfs -x squashfs -l -P
format   = table

[check mounts]
interval = 5min
exec     = echo "dev mountpoint fstype options"; grep -E ' (ext[234]|xfs|btrfs|zfs|nfs4?) ' /proc/mounts | cut -d' ' -f1-4; true
format   = table

# TCP: retransmits, listen queue overflows (connections refused / slow), resets
[check tcp]
interval = 10
exec     = awk '$1!=p{p=$1; split($0,k); next} {p=""; for(i=2;i<=NF;i++) print substr($1,1,length($1)-1) "." k[i], $i}' /proc/net/snmp /proc/net/netstat | awk '$1 ~ /^(Tcp[.](ActiveOpens|PassiveOpens|AttemptFails|EstabResets|CurrEstab|InSegs|OutSegs|RetransSegs|InErrs|OutRsts)|TcpExt[.](ListenOverflows|ListenDrops|TCPTimeouts|TCPLostRetransmit|TCPSynRetrans|TCPAbortOnMemory|TCPAbortOnTimeout|TCPBacklogDrop|TCPReqQFullDrop|TCPMemoryPressures|SyncookiesSent)|Udp[.]RcvbufErrors)$/ {h=h" "$1; v=v" "$2} END{print h; print v}'
format   = table

# per interface bytes / packets / errors / drops
[check netdev]
interval = 10
exec     = awk 'BEGIN{print "dev rx_bytes rx_packets rx_errs rx_drop tx_bytes tx_packets tx_errs tx_drop"} NR>2{sub(/:/," "); if ($1 !~ /^(lo|veth.*)$/) print $1,$2,$3,$4,$5,$10,$11,$12,$13}' /proc/net/dev
format   = table

# sockets and file handles in use
[check sockets]
interval = 30
exec     = awk 'FILENAME ~ /file-nr/{print "file_handles", $1; print "file_handles_max", $3} /^TCP:/{print "tcp_inuse", $3; print "tcp_orphan", $5; print "tcp_tw", $7; print "tcp_mem_pages", $11}' /proc/sys/fs/file-nr /proc/net/sockstat
format   = kv

# -------------------------------------------------- system: what changed
# What changed: kernel settings, THP, mount options (an ext4 remounted read-only!), boot
[check sysconfig]
interval = 1h
keep     = 35d
exec     = echo "kernel $(uname -r)"; echo "boot_id $(cat /proc/sys/kernel/random/boot_id)"; for f in swappiness dirty_ratio dirty_bytes dirty_background_ratio dirty_background_bytes overcommit_memory overcommit_ratio min_free_kbytes zone_reclaim_mode nr_hugepages watermark_scale_factor; do [ -r /proc/sys/vm/$f ] && echo "vm.$f $(cat /proc/sys/vm/$f)"; done; echo "somaxconn $(cat /proc/sys/net/core/somaxconn)"; echo "thp $(sed 's/.*[[]//; s/].*//' /sys/kernel/mm/transparent_hugepage/enabled 2>/dev/null)"; for g in /sys/block/*/queue/scheduler; do [ -r $g ] && echo "scheduler.$(echo $g | cut -d/ -f4) $(sed 's/.*[[]//; s/].*//' $g)"; done; true
format   = kv

# ==================================================================== PostgreSQL
# Runs on every cluster, unless "clusters = a, b" is given. The checks that need the
# dba schema or pg_stat_statements are limited to main.

# -------------------------------------------------------------- activity
# One row: the first graph to look at. Connections, oldest things, xid and WAL rate.
# min_xmin_age is only what backends hold; see xmin_holders for slots etc.
[check instance]
interval = 10
keep     = 35d
query    = select pg_is_in_recovery() as in_recovery, pg_postmaster_start_time() as started,
                  pg_conf_load_time() as conf_loaded,
                  (case when pg_is_in_recovery() then pg_last_wal_replay_lsn()
                        else pg_current_wal_insert_lsn() end - '0/0'::pg_lsn) as lsn_bytes,
                  pg_snapshot_xmax(pg_current_snapshot()) as next_xid,
                  current_setting('max_connections')::int as max_connections, a.*
           from (select count(*) filter (where backend_type = 'client backend') as clients,
                        count(*) filter (where backend_type = 'client backend' and state = 'active') as active,
                        count(*) filter (where state like 'idle in transaction%') as idle_in_xact,
                        count(*) filter (where wait_event_type = 'Lock') as waiting_lock,
                        count(*) filter (where wait_event_type = 'LWLock') as waiting_lwlock,
                        count(*) filter (where wait_event_type = 'IO') as waiting_io,
                        count(*) filter (where backend_type = 'parallel worker') as parallel_workers,
                        count(*) filter (where backend_type = 'autovacuum worker') as autovacuum_workers,
                        count(*) filter (where backend_start > clock_timestamp() - interval '10 s'
                                           and backend_type = 'client backend') as new_clients,
                        extract(epoch from max(clock_timestamp() - xact_start)
                                filter (where backend_type = 'client backend')) as oldest_xact_s,
                        extract(epoch from max(clock_timestamp() - query_start)
                                filter (where backend_type = 'client backend' and state = 'active')) as oldest_query_s,
                        extract(epoch from max(clock_timestamp() - state_change)
                                filter (where state like 'idle in transaction%')) as longest_idle_in_xact_s,
                        max(age(backend_xmin)) as max_xmin_age
                 from pg_stat_activity where pid <> pg_backend_pid()) a

# Poor man's ASH. Who was running / waiting, on what, for which query_id. Idle
# backends collapse into one row per database and user; background processes
# (checkpointer, walwriter, io of autovacuum) are in, which full_activity misses
# (their state is NULL). query_id needs compute_query_id (auto + pg_stat_statements); it is
# empty for a backend waiting for a relation lock while parsing: see full_activity.
[check ash]
interval = 5
query    = select backend_type, datname, usename, state, wait_event_type, wait_event,
                  case when state <> 'idle' then query_id end as query_id,
                  count(*) as n,
                  round(extract(epoch from max(clock_timestamp() - query_start)
                        filter (where state <> 'idle'))::numeric, 1) as max_query_s,
                  round(extract(epoch from max(clock_timestamp() - xact_start))::numeric, 1) as max_xact_s
           from pg_stat_activity
           where pid <> pg_backend_pid()
             and wait_event_type is distinct from 'Activity'
           group by 1,2,3,4,5,6,7

# was: state != 'idle' (drops NULL states) and select * with the full query text.
# query_id joins to ash and pgss. Literals are in the text: shorten more, or drop it.
[check full_activity]
interval = 15
query    = select clock_timestamp()-xact_start as x_age, clock_timestamp()-query_start as q_age,
                  clock_timestamp()-state_change as s_age,
                  pid, leader_pid, datname, usename, application_name, client_addr, backend_type,
                  backend_start, xact_start, query_start, state_change, wait_event_type, wait_event, state,
                  backend_xid, age(backend_xmin) as xmin_age, query_id, left(query, 2000) as query
           from pg_stat_activity
           where pid <> pg_backend_pid()
             and (state is distinct from 'idle' and wait_event_type is distinct from 'Activity')
           order by 2 desc nulls last

[check activity_readable]
interval = 15
clusters = main
query    = select * from dba.activity

# was: every 5s without state. ash has the waits; this keeps "who opened connections".
[check conn_count]
interval = 15
query    = select datname, usename, application_name, client_addr, state, count(*) as count
           from pg_stat_activity where backend_type = 'client backend' group by 1,2,3,4,5

# ----------------------------------------------------------------- locks
# One row per waiting backend with its direct and root blockers. Instead of the
# dba.lock* views, so that it is safe with any version of the dba schema.
[check lock_tree]
interval = 15
query    = with recursive w as materialized (
             select a.pid, a.usename, a.application_name, a.wait_event, a.query_id, a.query, a.query_start,
                    array(select distinct unnest(pg_blocking_pids(a.pid)))::int[] as blockers
             from pg_stat_activity a
             where a.wait_event_type = 'Lock'
             order by a.query_start limit 200
           ), edge as materialized (
             select w.pid, b as blocker from w cross join lateral unnest(w.blockers) b
           ), reach(pid, root) as (
             select pid, blocker from edge
             union
             select r.pid, e.blocker from reach r join edge e on e.pid = r.root
           ), roots as (
             select r.pid, array_agg(r.root order by r.root) as root_pids
             from reach r where not exists (select 1 from edge e where e.pid = r.root)
             group by r.pid
           )
           select w.pid, w.usename, w.application_name, w.wait_event as lock_type,
                  extract(epoch from clock_timestamp() - l.waitstart)::numeric(12,1) as waiting_s,
                  cardinality(w.blockers) as n_blockers, w.blockers[1:10] as blockers, r.root_pids[1:10] as root_pids,
                  rt.state as root_state, extract(epoch from now() - rt.xact_start)::numeric(12,1) as root_xact_s,
                  rt.usename as root_user, rt.wait_event as root_wait, left(regexp_replace(rt.query, '\s+', ' ', 'g'), 200) as root_query,
                  w.query_id, left(regexp_replace(w.query, '\s+', ' ', 'g'), 200) as query
           from w
           left join roots r on r.pid = w.pid
           left join pg_stat_activity rt on rt.pid = r.root_pids[1]
           left join (select pid, min(waitstart) as waitstart from pg_locks where not granted group by pid) l on l.pid = w.pid
           order by waiting_s desc nulls last

# Totals, not details (lock_tree has those). relation locks with fastpath = f in
# large numbers: lock manager contention, partition / index count problem.
# lock_slots: the lock table is full when n (fastpath = f) gets near it.
[check lock_totals]
interval = 30
query    = select locktype, mode, granted, fastpath, count(*) as n, min(waitstart) as oldest_wait,
                  current_setting('max_locks_per_transaction')::int *
                  (current_setting('max_connections')::int + current_setting('max_prepared_transactions')::int) as lock_slots
           from pg_locks where pid is distinct from pg_backend_pid() group by 1,2,3,4

# Off: lock_tree has all of it in one query. Rows grow with n^2/2.
[check lock_blocks]
enabled  = off
interval = 15
query    = select * from dba.lock

# Off: only safe with the lock views of this project's dba_schema.v3.sql (one row per
# waiter). Older versions return 2^n rows.
[check lock_dependencies]
enabled  = off
interval = 15
query    = select * from dba.lock_dependencies

[check lock_hierarchy]
enabled  = off
interval = 15
query    = select * from dba.lock_hierarchy

# --------------------------------------------------- alerts (dba schema)
# reads pg_locks and the archive_status directory
[check dbstate]
interval = 15
clusters = main
query    = select check_id, description, current_value, state, notes from dba.state

# rows = checks of dba.alert_state that silently return nothing
[check alerts_missing]
interval = 5min
keep     = 35d
clusters = main
query    = select * from dba.alert_state_missing

[check alerts_silenced]
interval = 1h
keep     = 35d
clusters = main
query    = select * from dba.alert_silenced

[check sequence_exhaustion]
interval = 1h
keep     = 35d
clusters = main
query    = select * from dba.sequence_exhaustion

# planner statistics only; pg_stats shows a role only the tables it can read
[check int_overflow]
interval = 6h
keep     = 35d
clusters = main
query    = select * from dba.int_overflow where pct_of_type_max > 30

# ----------------------------- statements (extension pg_stat_statements)
# Top by total time, top by time rate since the entry appeared (new statements),
# and whatever is running now (a regressed old one). showtext=false: the query text
# file is not read. If the extension is not in the search_path, qualify it.
# Deltas per queryid give load per minute. Statements in none of the three groups
# are only in pgss_all, once per hour.
[check pgss_top]
interval = 60
clusters = main
query    = select userid, dbid, queryid, toplevel, calls, round(total_exec_time::numeric, 1) as total_exec_ms,
                  rows, shared_blks_hit, shared_blks_read, shared_blks_dirtied, shared_blks_written,
                  round(shared_blk_read_time::numeric, 1) as read_ms, temp_blks_read, temp_blks_written,
                  wal_bytes, stats_since
           from (select *, row_number() over (order by total_exec_time desc) as r1,
                        row_number() over (order by total_exec_time /
                             greatest(extract(epoch from clock_timestamp() - stats_since), 300) desc) as r2
                 from pg_stat_statements(false)) s
           where r1 <= 100 or r2 <= 50
              or queryid in (select query_id from pg_stat_activity where state = 'active')

# everything, for before / after comparison of any statement (pg_stat_statements.max rows)
[check pgss_all]
interval = 1h
clusters = main
keep     = 35d
query    = select userid, dbid, queryid, toplevel, calls, round(total_exec_time::numeric, 1) as total_exec_ms,
                  round(max_exec_time::numeric, 1) as max_exec_ms, rows, shared_blks_hit, shared_blks_read,
                  temp_blks_written, wal_bytes, stats_since
           from pg_stat_statements(false)

# queryid -> text. Reads the whole text file (look at its size first:
# pg_stat_tmp/pgss_query_texts.stat), so rarely. Normalized, but may hold
# literals in utility statements: same sensitivity as full_activity.
[check pgss_text]
interval = 6h
clusters = main
keep     = 35d
query    = select queryid, dbid, userid, left(query, 500) as query
           from pg_stat_statements order by total_exec_time desc limit 500

# dealloc growing: pgss is churning and its numbers are incomplete
[check pgss_info]
interval = 60
clusters = main
query    = select dealloc, stats_reset from pg_stat_statements_info

# -------------------------------------------- databases, tables, indexes
# was 60s: too coarse to see a spike (commits, deadlocks, temp, sessions_killed ...)
[check database_stats]
interval = 10
query    = select * from pg_stat_database

# was 60s: stat() of every file of every database, blocking the session up to 5s.
# df shows growth every minute anyway.
[check database_size]
interval          = 1h
statement_timeout = 5s
keep              = 35d
query             = select datname, pg_database_size(oid) as size from pg_database

# was: 60s with pg_relation_size / pg_total_relation_size, which WAIT for
# AccessExclusiveLock: one locked table and the whole check fails (lock_timeout).
[check table_stats]
interval = 60
query    = select s.*, pg_stat_get_blocks_fetched(relid) as blks_fetched, pg_stat_get_blocks_hit(relid) as blks_hit
           from pg_stat_all_tables s where schemaname = 'public'

[check index_stats]
interval = 5min
query    = select s.*, pg_stat_get_blocks_fetched(indexrelid) as blks_fetched, pg_stat_get_blocks_hit(indexrelid) as blks_hit
           from pg_stat_all_indexes s where schemaname = 'public'

# Sizes of tables, indexes and toast (total_size = sum by parent, offline). Leaves out
# relations with a held or pending AccessExclusiveLock, so it neither fails nor queues.
[check relation_size]
interval          = 15min
keep              = 35d
query             = with locked as materialized (
                      select relation from pg_locks where locktype = 'relation' and mode = 'AccessExclusiveLock'
                         and database = (select oid from pg_database where datname = current_database())),
                    rel as materialized (
                      select c.oid, c.relname, c.relkind, coalesce(i.indrelid, t.oid, c.oid) as parent
                      from pg_class c
                           left join pg_index i on i.indexrelid = c.oid
                           left join pg_class t on c.relkind = 't' and t.reltoastrelid = c.oid
                      where c.relkind in ('r', 'm', 'i', 't') and c.relpersistence <> 't'
                        and c.relnamespace in ('public'::regnamespace, 'pg_toast'::regnamespace)
                        and c.oid not in (select relation from locked))
                    select oid, relname, relkind, parent, pg_relation_size(oid) as size from rel

# Bloat / freeze / autovacuum raw material without touching the relations (no locks,
# no stat()): pages, tuples, all-visible pages, ages, per table autovacuum options.
[check relation_pages]
interval = 1h
keep     = 35d
query    = select c.oid, n.nspname, c.relname, c.relkind, c.relpages, c.reltuples::bigint as reltuples, c.relallvisible,
                  case when c.relfrozenxid <> '0' then age(c.relfrozenxid) end as xid_age,
                  case when c.relminmxid <> '0' then mxid_age(c.relminmxid) end as mxid_age, c.reloptions
           from pg_class c join pg_namespace n on n.oid = c.relnamespace
           where c.relkind in ('r', 'm', 't', 'i')
             and (c.relpages >= 128 or (c.relfrozenxid <> '0' and age(c.relfrozenxid) > 100000000))

# ------------------------------------------------- I/O, WAL, checkpoints
# per backend type / object / context; NULL-only combinations left out. The times
# need track_io_timing. select * is fine: the exporter copes with new columns
# (PostgreSQL 18 changes this view and moves WAL i/o into it).
[check io]
interval = 60
query    = select * from pg_stat_io
           where coalesce(reads, 0) + coalesce(writes, 0) + coalesce(extends, 0) + coalesce(hits, 0)
                 + coalesce(evictions, 0) + coalesce(fsyncs, 0) > 0

# wal_buffers_full, full page images after a checkpoint; times need track_wal_io_timing
[check wal]
interval = 15
keep     = 35d
query    = select * from pg_stat_wal

# num_requested rising = max_wal_size too small; write/sync time of a bad checkpoint
[check checkpointer]
interval = 30
keep     = 35d
query    = select c.*, b.buffers_clean, b.maxwritten_clean, b.buffers_alloc, b.stats_reset as bgwriter_reset
           from pg_stat_checkpointer c, pg_stat_bgwriter b

# subtransaction / multixact SLRU thrashing (the "SubtransSLRU" kind of outage)
[check slru]
interval = 60
query    = select * from pg_stat_slru

# Which backends overflowed their 64 subtransaction slots (slow snapshots for
# everybody). Usually 0 rows.
[check subxact]
interval = 30
query    = select a.pid, a.datname, a.usename, a.application_name, a.state, a.xact_start,
                  s.subxact_count, s.subxact_overflowed
           from (select pg_stat_get_backend_pid(id) as pid, (pg_stat_get_backend_subxact(id)).*
                 from pg_stat_get_backend_idset() as id) s
                join pg_stat_activity a using (pid)
           where s.subxact_overflowed or s.subxact_count > 32

# temp files on disk right now, per backend: who fills the disk / sorts on disk.
# (parallel hash / sort files live in sub-directories and are not seen)
[check temp_files]
interval = 30
query    = select t.spcname, f.pid, a.query_id, a.usename, a.application_name, f.files, f.bytes
           from (select oid, spcname from pg_tablespace where spcname <> 'pg_global') t
                cross join lateral (
                  select substring(name from '^pgsql_tmp([0-9]+)')::int as pid, count(*) as files, sum(size) as bytes
                  from pg_ls_tmpdir(t.oid) group by 1) f
                left join pg_stat_activity a on a.pid = f.pid

# files in pg_wal and waiting for the archiver. stat() per file: not more often
[check wal_files]
interval = 5min
query    = select (select count(*) from pg_ls_waldir()) as files, (select sum(size) from pg_ls_waldir()) as bytes,
                  (select count(*) from pg_ls_archive_statusdir() where name like '%.ready') as archive_ready

[check archiver]
interval = 60
query    = select * from pg_stat_archiver

# Optional. Needs extension pg_buffercache. Reads every buffer header, without locks.
# Cost grows with shared_buffers and was only measured at 24MB: time it by hand first.
[check buffercache]
enabled  = no
interval = 5min
query    = select * from pg_buffercache_summary()

# ---------------------------------------------- vacuum, xmin, wraparound
# Why dead rows are not removed: everything that holds the horizon back, 20 oldest.
[check xmin_holders]
interval = 30
query    = select * from (
             select 'backend' as kind, pid::text as name, datname::text, usename::text as owner,
                    state, age(backend_xmin) as xmin_age, age(backend_xid) as xid_age, null::int as catalog_age, xact_start as since
             from pg_stat_activity where (backend_xmin is not null or backend_xid is not null) and pid <> pg_backend_pid()
             union all
             select 'slot', slot_name::text, database::text, plugin::text, case when active then 'active' else 'inactive' end,
                    age(xmin), null, age(catalog_xmin), inactive_since
             from pg_replication_slots where xmin is not null or catalog_xmin is not null
             union all
             select 'prepared', gid, database::text, owner::text, null, null, age(transaction), null, prepared
             from pg_prepared_xacts) x
           order by greatest(xmin_age, xid_age, catalog_age) desc nulls last limit 20

# dead_tuple_bytes / max_dead_tuple_bytes (17): how full is the memory;
# index_vacuum_count > 1: maintenance_work_mem too small
[check vacuum_progress]
interval = 15
query    = select p.*, c.relname, a.query like '%to prevent wraparound%' as wraparound,
                  a.wait_event_type, a.wait_event, a.xact_start
           from pg_stat_progress_vacuum p
                left join pg_class c on c.oid = p.relid and p.datname = current_database()
                left join pg_stat_activity a using (pid)

# what else was running: index builds, analyze, VACUUM FULL, COPY, base backup
[check progress]
interval = 15
query    = select 'create_index' as what, pid, datname, relid, phase, lockers_done as d1, lockers_total as t1, blocks_done as done, blocks_total as total
           from pg_stat_progress_create_index
           union all select 'analyze', pid, datname, relid, phase, null, null, sample_blks_scanned, sample_blks_total
           from pg_stat_progress_analyze
           union all select lower(command), pid, datname, relid, phase, null, null, heap_blks_scanned, heap_blks_total
           from pg_stat_progress_cluster
           union all select 'copy ' || command, pid, datname, relid, type, tuples_processed, null, bytes_processed, bytes_total
           from pg_stat_progress_copy where pid <> pg_backend_pid()
           union all select 'basebackup', pid, null, null, phase, null, null, backup_streamed, backup_total
           from pg_stat_progress_basebackup

[check xid_age]
interval = 5min
keep     = 35d
query    = select datname, age(datfrozenxid) as xid_age, mxid_age(datminmxid) as mxid_age from pg_database

# ----------------------------------------------------------- replication
[check replication]
interval = 15
query    = select pid, usename, application_name, client_addr, state, sync_state, backend_start, age(backend_xmin) as xmin_age,
                  (case when pg_is_in_recovery() then pg_last_wal_replay_lsn() else pg_current_wal_lsn() end - sent_lsn) as sent_lag_bytes,
                  sent_lsn - write_lsn as write_lag_bytes, write_lsn - flush_lsn as flush_lag_bytes,
                  flush_lsn - replay_lsn as replay_lag_bytes, write_lag, flush_lag, replay_lag, reply_time
           from pg_stat_replication

# safe_wal_size / wal_status: how close to filling pg_wal or losing the slot
[check slots]
interval = 60
query    = select slot_name, slot_type, database, active, active_pid, wal_status, safe_wal_size, inactive_since, invalidation_reason,
                  (case when pg_is_in_recovery() then pg_last_wal_replay_lsn() else pg_current_wal_lsn() end - restart_lsn) as retained_bytes,
                  (case when pg_is_in_recovery() then pg_last_wal_replay_lsn() else pg_current_wal_lsn() end - confirmed_flush_lsn) as unconfirmed_bytes
           from pg_replication_slots

# logical decoding spilling to disk; 0 rows without logical slots
[check slot_stats]
interval = 60
query    = select * from pg_stat_replication_slots

# standby only: 0 rows on a primary
[check recovery]
interval = 15
query    = select pg_last_wal_receive_lsn() - pg_last_wal_replay_lsn() as replay_lag_bytes,
                  clock_timestamp() - pg_last_xact_replay_timestamp() as replay_age,
                  pg_is_wal_replay_paused() as paused, r.status, r.sender_host, r.latest_end_time, r.received_tli
           from (select 1 where pg_is_in_recovery()) x left join pg_stat_wal_receiver r on true

[check conflicts]
interval = 60
query    = select * from pg_stat_database_conflicts where pg_is_in_recovery()

# -------------------------------------------------------------- settings
# reads pg_settings as seen by this session: the settings the daemon sets itself
# (source = client: statement_timeout, work_mem, jit ...) are hidden, so left out
[check settings]
interval = 1h
keep     = 35d
query    = select name, setting, unit, source, sourcefile, sourceline, pending_restart
           from pg_settings where source not in ('default', 'client', 'session') or pending_restart

[check role_settings]
interval = 1h
keep     = 35d
query    = select setdatabase, setrole, d.datname, setrole::regrole::text as role, setconfig
           from pg_db_role_setting s left join pg_database d on d.oid = s.setdatabase
